repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write
        language: system
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
          - json
          - jsonc
          - css
          - scss
          - markdown
      - id: eslint
        name: eslint
        entry: pnpm exec eslint --fix
        language: system
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
      - id: knip
        name: knip
        entry: pnpm exec knip
        language: system
        pass_filenames: false
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
