[project]
name = "webkiln"
version = "0.1.0"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = []

[dependency-groups]
dev = [
  "pyrefly>=1.4.1",
  "pytest>=9.2",
]

[tool.uv]
workspace.members = [
  "agents",
  "api",
]

[tool.ruff]
line-length = 100
lint.select = [
  "ASYNC", # Async-related checks
  "B",     # Bugbear
  "C4",    # Comprehension improvements
  "DTZ",   # Datetime timezone awareness
  "E",     # pycodestyle errors
  "F",     # Pyflakes
  "FAST",  # FastAPI-specific checks
  "G",     # Logging format
  "I",     # Import sorting
  "LOG",   # Logging best practices
  "PERF",  # Performance
  "PIE",   # Miscellaneous improvements
  "PT",    # pytest best practices
  "PTH",   # pathlib
  "RUF",   # Ruff-specific rules
  "S",     # Bandit security checks
  "SIM",   # Simplification
  "T20",   # Prevent accidental print statements
  "TRY",   # Exception handling
  "UP",    # Python modernization
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [ "S101", "S105", "S106" ]

[tool.pyrefly]
project-includes = [
  "**/*.py*",
  "**/*.pyi",
]

[tool.pytest]
pythonpath = [ "." ]
