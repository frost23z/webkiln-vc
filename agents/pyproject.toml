[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13.8,<0.14" ]

[project]
name = "webkiln-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [ { name = "frost23z", email = "80541095+frost23z@users.noreply.github.com" } ]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "httpx>=0.28.1",
  "langchain-google-genai>=4.5.2",
  "langchain-groq>=1.2.1",
  "langchain-huggingface>=1.2.3",
  "langchain-openrouter>=0.3",
  "langgraph>=1.2.22",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.3",
]
scripts.check-memory = "webkiln_agents.scripts:check_memory"
scripts.check-structured-output = "webkiln_agents.scripts:check_structured_output"
scripts.webkiln-agents = "webkiln_agents:main"

[dependency-groups]
dev = [
  "langgraph-cli[inmem]>=0.4.43",
]
