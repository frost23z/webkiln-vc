[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13.8,<0.14" ]

[project]
name = "webkiln-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [ { name = "frost23z", email = "80541095+frost23z@users.noreply.github.com" } ]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "fastapi[standard-no-fastapi-cloud-cli]>=0.165",
  "langgraph-checkpoint-postgres>=3.2.1",
  "psycopg[binary,pool]>=3.3.9",
  "pydantic-settings>=2.16.3",
  "webkiln-agents",
]
scripts.export-openapi-schema = "webkiln_api.scripts:export_openapi_schema"
scripts.webkiln-api = "webkiln_api:main"

[tool.uv]
sources.webkiln-agents = { workspace = true }

[tool.fastapi]
entrypoint = "webkiln_api.main:app"
