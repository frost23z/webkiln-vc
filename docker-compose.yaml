services:
  db:
    image: pgvector/pgvector:pg18
    container_name: webkiln-db
    environment:
      POSTGRES_USER: webkiln
      POSTGRES_PASSWORD: webkiln
      POSTGRES_DB: webkiln
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webkiln -d webkiln"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  db-data:
